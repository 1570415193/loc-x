
name: Build loc-x

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install OpenSSL 3
        run: brew install openssl@3

      - name: Build loc-x
        run: |
          export WLOC_KEYS_DIR="$RUNNER_TEMP/loc-x-private-keys"
          python3 build.py

      - name: Upload TIPA and IPA
        uses: actions/upload-artifact@v4
        with:
          name: loc-x-installers
          path: |
            loc-x-0.3.6.tipa
